<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MogRun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd7ff;font-family:Inter,Arial,sans-serif;touch-action:none}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#10233d}
.logo{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:1000;font-size:34px;letter-spacing:4px;color:white;text-shadow:0 5px 0 #397db7,0 8px 18px #164d7c;transition:all .8s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.runHud{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:18px;background:rgba(10,43,72,.26);backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(20,70,110,.2)}
.level{font-size:15px;font-weight:1000;color:#fff;text-shadow:0 2px 5px #174c78;white-space:nowrap}.looksWrap{width:min(330px,55vw);height:13px;border:2px solid rgba(255,255,255,.9);border-radius:20px;background:rgba(25,75,120,.25);overflow:hidden}.looks{height:100%;width:0;background:linear-gradient(90deg,#72f2c4,#6fd5ff,#a78bff);border-radius:20px;transition:width .12s}
.money{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.92);padding:10px 15px;border-radius:17px;font-weight:900;box-shadow:0 7px 22px #397db744}.pause{position:absolute;top:18px;left:18px;width:46px;height:46px;border:0;border-radius:15px;background:rgba(255,255,255,.92);pointer-events:auto;font-size:18px;font-weight:1000;color:#174c78;box-shadow:0 7px 22px #397db744}
.startPanel{position:absolute;inset:auto 0 0 0;padding:0 18px 28px;display:flex;justify-content:center;pointer-events:auto}.startBtn{border:0;padding:18px 58px;border-radius:23px;background:linear-gradient(135deg,#fff,#eaf6ff);font-size:21px;font-weight:1000;color:#174c78;box-shadow:0 12px 35px #205d8a55;cursor:pointer}
.home{position:absolute;bottom:22px;left:18px;right:18px;display:flex;gap:10px;justify-content:center;pointer-events:auto}.hbtn{border:0;border-radius:18px;padding:13px 17px;background:rgba(255,255,255,.9);font-weight:900;color:#174c78;box-shadow:0 8px 24px #205d8a33}
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#081b2e66;backdrop-filter:blur(8px);pointer-events:auto}.card{width:min(440px,92vw);background:linear-gradient(#fff,#edf7ff);border-radius:28px;padding:24px;box-shadow:0 30px 80px #06152577}.card h2{margin:0 0 18px;font-size:27px}.card button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:17px;background:#dff1ff;color:#174c78;font-size:16px;font-weight:900}.card .primary{background:linear-gradient(135deg,#6adfff,#8f8cff);color:white}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.row label{font-weight:800}input[type=range]{width:190px}.upgrade{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0;padding:13px;border-radius:18px;background:#e8f5ff}.upgrade small{display:block;color:#56718b;margin-top:3px}.upgrade button{width:auto;margin:0;padding:10px 13px}.boss{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;display:none;color:white;text-shadow:0 3px 10px #174c78}.boss b{font-size:27px}.hint{position:absolute;bottom:94px;left:50%;transform:translateX(-50%);color:white;font-weight:800;text-shadow:0 2px 8px #174c78;white-space:nowrap}
.gateLabel{position:absolute;display:none;transform:translate(-50%,-50%);font-size:24px;font-weight:1000;color:white;text-shadow:0 3px 8px #173d61;pointer-events:none}
.resultTitle{font-size:29px}.resultText{color:#526a80;line-height:1.5}
@media(max-width:600px){.logo{font-size:29px;top:15px}.runHud{top:59px;gap:8px}.looksWrap{width:55vw}.money{top:14px;right:14px}.pause{top:14px;left:14px}}
</style>
</head>
<body>
<div id="ui">
  <div class="logo" id="logo">MogRun</div>
  <div class="runHud"><div class="level" id="level">Lvl 1</div><div class="looksWrap"><div class="looks" id="looks"></div></div></div>
  <div class="money" id="money">$0</div>
  <button class="pause" id="pauseBtn">II</button>
  <div class="startPanel" id="startPanel"><button class="startBtn" id="startBtn">START RUN</button></div>
  <div class="home" id="home"><button class="hbtn" id="upgradesBtn">UPGRADES</button><button class="hbtn" id="settingsBtn">SETTINGS</button></div>
  <div class="hint" id="hint">Drag left or right to move</div>
  <div class="boss" id="boss"><b>BOSS</b><div id="bossNeed"></div></div>
  <div class="panel" id="upgradesPanel"><div class="card"><h2>Upgrades</h2>
    <div class="upgrade"><div><b>GATE CONTROL</b><small>Improve the quality of positive gates</small></div><button id="gateUp">UPGRADE $100</button></div>
    <div class="upgrade"><div><b>MONEY</b><small>Earn more after defeating a boss</small></div><button id="moneyUp">UPGRADE $100</button></div>
    <div class="upgrade"><div><b>STARTING LOOKS</b><small>Begin each run with more Looks</small></div><button id="charUp">UPGRADE $100</button></div>
    <button id="closeUpgrades">CLOSE</button>
  </div></div>
  <div class="panel" id="settingsPanel"><div class="card"><h2>Settings</h2><div class="row"><label>Music</label><input id="musicVol" type="range" min="0" max="1" step=".01" value=".35"></div><div class="row"><label>Sound effects</label><input id="sfxVol" type="range" min="0" max="1" step=".01" value=".65"></div><button id="closeSettings">CLOSE</button></div></div>
  <div class="panel" id="pausePanel"><div class="card"><h2>Paused</h2><button class="primary" id="continueBtn">CONTINUE</button><button id="pauseSettings">SETTINGS</button><button id="pauseHome">EXIT RUN</button></div></div>
  <div class="panel" id="resultPanel"><div class="card"><h2 class="resultTitle" id="resultTitle">BOSS DEFEATED</h2><p class="resultText" id="resultText"></p><button class="primary" id="nextBtn">NEXT LEVEL</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const state={level:1,money:0,gate:0,moneyUp:0,char:0,started:false,paused:false,looks:100};
try{Object.assign(state,JSON.parse(localStorage.mogrun||'{}'))}catch(e){}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.floor(n).toLocaleString('en-US');
let scene,camera,renderer,player,playerGroup,bossGroup;
let running=false,runT=0,last=performance.now(),laneTarget=0,laneX=0,gates=[],obstacles=[];
let audioCtx,musicGain,sfxGain,musicTimer;
let bossBusy=false;
function save(){localStorage.mogrun=JSON.stringify(state)}
function mat(c,rough=.55){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.02})}
function skinMat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:0})}
function mesh(geo,material){const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;return m}
function capsule(r,len,c){return mesh(new THREE.CapsuleGeometry(r,len,8,20),mat(c))}
function sphere(r,c){return mesh(new THREE.SphereGeometry(r,28,20),skinMat(c))}
function limb(r,len,c){return mesh(new THREE.CapsuleGeometry(r,len,10,18),mat(c))}
function createHuman(stage=0,boss=false){
  const g=new THREE.Group();
  const skin=[0xd39a72,0xe0ab83,0xc98761,0xe7b48d,0xb97952,0x9c623f][stage%6];
  const shirt=[0x777b80,0x27384a,0xffffff,0x17202a,0x355f8a,0x202020][stage%6];
  const pants=[0x3b424b,0x202630,0x596d82,0x16191d,0x202d40,0x111317][stage%6];
  const shoe=[0x292d32,0xffffff,0x20252b,0x111318,0xd7dce1,0x181a1d][stage%6];
  const head=sphere(.68,skin);head.position.set(0,3.16,0);g.add(head);
  const neck=capsule(.18,.24,skin);neck.position.y=2.46;g.add(neck);
  const torso=capsule(.48,1.05,shirt);torso.scale.set(1.03,1,0.72);torso.position.y=1.82;g.add(torso);
  const pelvis=capsule(.43,.34,pants);pelvis.scale.set(1.18,1,.75);pelvis.position.y=.94;g.add(pelvis);
  for(const side of [-1,1]){
    const upper=limb(.14,.58,shirt);upper.position.set(side*.62,1.94,0);upper.rotation.z=side*.08;g.add(upper);
    const fore=limb(.12,.58,skin);fore.position.set(side*.69,1.28,0);fore.rotation.z=side*.05;g.add(fore);
    const hand=sphere(.16,skin);hand.position.set(side*.69,.88,0);g.add(hand);
    const thigh=limb(.18,.66,pants);thigh.position.set(side*.23,.40,0);g.add(thigh);
    const shin=limb(.15,.62,pants);shin.position.set(side*.23,-.30,0);g.add(shin);
    const foot=capsule(.16,.48,shoe);foot.rotation.x=Math.PI/2;foot.scale.z=1.35;foot.position.set(side*.23,-.78,-.08);g.add(foot);
  }
  // Hair cap, short back/side silhouette. Face is on -Z so the runner moves forward naturally.
  const hair=sphere(.71,stage>=3?0x141619:0x242326);hair.scale.set(1.02,.48,1.0);hair.position.set(0,3.56,-.01);g.add(hair);
  if(stage===0){
    // messy fringe + acne for the starter form
    for(const x of [-.42,-.2,0,.2,.4]){const lock=capsule(.11,.32,0x242326);lock.position.set(x*.8,3.52,-.23);lock.rotation.z=x*.7;g.add(lock)}
    for(const p of [[-.26,3.23,-.62],[.27,3.08,-.61],[-.05,2.96,-.64]]){const acne=sphere(.045,0xb94e50);acne.position.set(...p);g.add(acne)}
  } else if(stage===1){
    const fade=sphere(.73,0x242326);fade.scale.set(1,.38,.98);fade.position.set(0,3.52,-.02);g.add(fade);
  } else if(stage>=2){
    const styled=sphere(.72,0x17191b);styled.scale.set(1,.34,.98);styled.position.set(0,3.58,-.02);g.add(styled);
  }
  // Ears / face details are placed on the actual front (-Z), useful during boss encounter.
  for(const side of [-1,1]){
    const ear=sphere(.11,skin);ear.position.set(side*.69,3.16,0);g.add(ear);
    if(boss){const eye=sphere(.075,0x16191c);eye.position.set(side*.23,3.22,-.62);g.add(eye)}
  }
  if(stage>=2){
    const jaw=mesh(new THREE.SphereGeometry(.5,24,16),skinMat(skin));jaw.scale.set(1,.36,.62);jaw.position.set(0,2.88,-.18);g.add(jaw);
  }
  if(stage>=3){
    const glasses=new THREE.Group();
    for(const side of [-1,1]){const l=mesh(new THREE.TorusGeometry(.17,.025,10,24),mat(0x15191f,.25));l.position.set(side*.24,3.2,-.66);glasses.add(l)}
    const bridge=mesh(new THREE.BoxGeometry(.12,.025,.025),mat(0x15191f,.25));bridge.position.set(0,3.2,-.66);glasses.add(bridge);g.add(glasses);
  }
  if(stage>=4){
    const jacket=capsule(.55,1.02,0x15181d);jacket.scale.set(1.03,1,.72);jacket.position.set(0,1.82,.02);g.add(jacket);
  }
  // Run-facing direction: forward is -Z.
  g.rotation.y=0;
  return g;
}
function init(){
  scene=new THREE.Scene();scene.fog=new THREE.Fog(0x8fd7ff,28,155);
  camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,320);camera.position.set(0,5.5,10.8);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xeafaff,0x6c8ca3,2.6));const sun=new THREE.DirectionalLight(0xffffff,3.5);sun.position.set(-12,20,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
  const sky=new THREE.Mesh(new THREE.SphereGeometry(190,40,24),new THREE.MeshBasicMaterial({color:0x8fd7ff,side:THREE.BackSide}));scene.add(sky);
  const road=mesh(new THREE.BoxGeometry(14,.42,300),mat(0xfafcff,.78));road.position.set(0,-.25,-125);scene.add(road);
  for(const x of [-4.7,4.7]){const edge=mesh(new THREE.BoxGeometry(.16,.11,300),mat(0xd4ebf5,.8));edge.position.set(x,0,-125);scene.add(edge)}
  for(let z=4;z>-290;z-=7){const line=mesh(new THREE.BoxGeometry(.07,.025,3.2),mat(0xb7dce9));line.position.set(0,.03,z);scene.add(line)}
  createPlayer();createBoss();buildLevel();bind();animate();
}
function createPlayer(){playerGroup=new THREE.Group();player=createHuman(0,false);playerGroup.add(player);playerGroup.position.set(0,0,4);scene.add(playerGroup)}
function createBoss(){bossGroup=new THREE.Group();bossGroup.position.set(0,0,-28);bossGroup.visible=false;scene.add(bossGroup)}
function rebuildPlayer(){playerGroup.clear();player=createHuman(Math.min(5,Math.floor((state.level-1)/8)),false);playerGroup.add(player)}
function gateValues(i){
  const lv=state.level;const boost=1+state.gate*.05;
  const pos=i%2===0?{op:'+',val:Math.max(8,Math.round((14+lv*2)*boost))}:{op:'×',val:Math.min(2.2,1.15+lv*.006+state.gate*.02)};
  const neg=i%2===0?{op:'−',val:Math.max(7,Math.round(10+lv*1.4))}:{op:'÷',val:Math.min(3,Math.max(2,Math.round(2+lv/30)))};
  return [pos,neg];
}
function buildLevel(){
  gates.forEach(g=>scene.remove(g));obstacles.forEach(o=>scene.remove(o));gates=[];obstacles=[];
  for(let z=-16,i=0;z>-142;z-=15,i++){
    const pair=gateValues(i);const group=new THREE.Group();
    const left=makeGate(pair[0].op,pair[0].val,true);const right=makeGate(pair[1].op,pair[1].val,false);
    left.position.x=-2.35;right.position.x=2.35;group.add(left,right);group.position.z=z;scene.add(group);gates.push(group);
    if(i%3===2){const o=mesh(new THREE.IcosahedronGeometry(.58,2),mat(0xe25b69));o.position.set((i%2?1:-1)*1.3,0.62,z-7);o.userData={hit:false};scene.add(o);obstacles.push(o)}
  }
}
function roundedShape(w,h,r){const s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s}
function makeGate(op,val,isLeft){
  const g=new THREE.Group();const color=isLeft?0x35d28f:0xf05b67;const dark=isLeft?0x179b6a:0xc63b49;
  const panel=mesh(new THREE.ExtrudeGeometry(roundedShape(2.35,3.65,.22),{depth:.16,bevelEnabled:true,bevelSize:.06,bevelThickness:.04,bevelSegments:2}),mat(color,.35));panel.rotation.x=0;panel.position.set(0,1.84,-.03);g.add(panel);
  const frame=mat(dark,.35);
  for(const x of [-1.2,1.2]){const p=mesh(new THREE.CylinderGeometry(.09,.11,3.95,18),frame);p.position.set(x,1.98,.08);g.add(p)}
  const top=mesh(new THREE.CylinderGeometry(.09,.11,2.5,18),frame);top.rotation.z=Math.PI/2;top.position.set(0,3.9,.08);g.add(top);
  const bottom=mesh(new THREE.CylinderGeometry(.09,.11,2.5,18),frame);bottom.rotation.z=Math.PI/2;bottom.position.set(0,.02,.08);g.add(bottom);
  const c=document.createElement('canvas');c.width=700;c.height=420;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='900 190px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=12;ctx.fillText(String(op)+String(val),350,215);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;const label=mesh(new THREE.PlaneGeometry(1.95,1.17),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));label.position.set(0,2.1,.18);g.add(label);
  g.userData={op,val};return g;
}
function applyGate(op,val){if(op==='+')state.looks+=Number(val);else if(op==='−')state.looks-=Number(val);else if(op==='×')state.looks*=Number(val);else if(op==='÷')state.looks/=Number(val);state.looks=clamp(state.looks,1,9999999)}
function startRun(){
  state.started=true;running=true;bossBusy=false;runT=0;state.looks=100+state.char*10;laneX=0;laneTarget=0;playerGroup.position.set(0,0,4);playerGroup.visible=true;
  $('startPanel').style.display='none';$('home').style.display='none';$('hint').textContent='Drag left or right to move';$('boss').style.display='none';$('resultPanel').style.display='none';$('logo').style.transform='translateX(-50%) translateY(-90px)';$('logo').style.opacity='.2';$('level').textContent='Lvl '+state.level;rebuildPlayer();buildLevel();save();startAudio();sfx(660,.07);
}
function endLevel(win){running=false;bossBusy=false;bossGroup.visible=false;const reward=Math.floor((40+state.level*12)*(1+state.moneyUp*.12));if(win){state.money+=reward;state.level++;$('resultTitle').textContent='BOSS DEFEATED';$('resultText').textContent='Reward: $'+fmt(reward);sfx(880,.14)}else{$('resultTitle').textContent='NOT ENOUGH LOOKS';$('resultText').textContent='The boss was stronger. Upgrade and try again.';sfx(180,.2)}$('resultPanel').style.display='flex';save()}
function bossFight(){if(bossBusy)return;bossBusy=true;running=false;$('boss').style.display='block';const stage=Math.min(5,Math.floor((state.level-1)/25));bossGroup.clear();const b=createHuman(stage,true);b.rotation.y=Math.PI;bossGroup.add(b);bossGroup.position.set(0,0,-20);bossGroup.scale.set(1.22,1.22,1.22);bossGroup.visible=true;const need=Math.floor(130+state.level*20);$('bossNeed').textContent='Required Looks: '+fmt(need)+'  •  You have: '+fmt(state.looks);setTimeout(()=>endLevel(state.looks>=need),1200)}
function animate(t=performance.now()){
  requestAnimationFrame(animate);const dt=Math.min(.035,(t-last)/1000);last=t;
  if(running&&!state.paused){runT+=dt;playerGroup.position.z-=dt*9;laneX+=(laneTarget-laneX)*Math.min(1,dt*11);playerGroup.position.x=laneX;
    // natural run cycle; character faces -Z and moves toward -Z
    const stride=Math.sin(runT*12);player.rotation.x=0;player.rotation.z=Math.sin(runT*12)*.018;player.children.forEach((m,idx)=>{if(idx%2===0&&m.position.x!==0)m.rotation.x=stride*.45});
    for(const gg of gates){if(gg.userData.hit)continue;if(Math.abs(gg.position.z-playerGroup.position.z)<.72){const chosen=laneX<0?gg.children[0]:gg.children[1];applyGate(chosen.userData.op,chosen.userData.val);gg.userData.hit=true;sfx(chosen.userData.op==='−'||chosen.userData.op==='÷'?180:720,.06)}}
    for(const o of obstacles){if(o.userData.hit)continue;if(Math.abs(o.position.z-playerGroup.position.z)<.7&&Math.abs(o.position.x-laneX)<1.05){o.userData.hit=true;state.looks*=.75;sfx(130,.1)}}
    // Smooth third-person follow camera.
    const camX=playerGroup.position.x*.42;const camZ=playerGroup.position.z+10.8;camera.position.x+=(camX-camera.position.x)*Math.min(1,dt*6);camera.position.y+=(5.5-camera.position.y)*Math.min(1,dt*6);camera.position.z+=(camZ-camera.position.z)*Math.min(1,dt*6);camera.lookAt(playerGroup.position.x*.18,2.05,playerGroup.position.z-12);
    updateLooks();
    if(playerGroup.position.z<-135)bossFight();
  }
  renderer.render(scene,camera);
}
function updateLooks(){const cap=Math.max(180,state.level*26);$('looks').style.width=Math.min(100,state.looks/cap*100)+'%';$('level').textContent='Lvl '+state.level}
function buy(key,btn){const base=100*(1+state[key]*.8);const cost=Math.floor(base);if(state.money<cost)return;state.money-=cost;state[key]++;btn.textContent='UPGRADE $'+Math.floor(100*(1+state[key]*.8));save();renderHome()}
function renderHome(){$('money').textContent='$'+fmt(state.money);$('gateUp').textContent='UPGRADE $'+Math.floor(100*(1+state.gate*.8));$('moneyUp').textContent='UPGRADE $'+Math.floor(100*(1+state.moneyUp*.8));$('charUp').textContent='UPGRADE $'+Math.floor(100*(1+state.char*.8));updateLooks()}
function openPanel(id){$(id).style.display='flex'}function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.style.display='none')}
function togglePause(){if(!running)return;state.paused=!state.paused;if(state.paused){$('pausePanel').style.display='flex';stopAudio()}else{$('pausePanel').style.display='none';startAudio()}}
function bind(){
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  let dragging=false;addEventListener('pointerdown',e=>{if(!running||state.paused)return;dragging=true;move(e)});addEventListener('pointermove',e=>{if(dragging)move(e)});addEventListener('pointerup',()=>dragging=false);function move(e){laneTarget=clamp((e.clientX/innerWidth-.5)*8.5,-4.25,4.25)}
  $('startBtn').onclick=startRun;$('pauseBtn').onclick=togglePause;$('continueBtn').onclick=()=>{state.paused=false;$('pausePanel').style.display='none';startAudio()};$('pauseSettings').onclick=()=>openPanel('settingsPanel');$('pauseHome').onclick=()=>{state.paused=false;running=false;$('pausePanel').style.display='none';$('home').style.display='flex';$('startPanel').style.display='flex';$('logo').style.transform='translateX(-50%)';$('logo').style.opacity='1';stopAudio()};
  $('upgradesBtn').onclick=()=>openPanel('upgradesPanel');$('settingsBtn').onclick=()=>openPanel('settingsPanel');$('closeUpgrades').onclick=closePanels;$('closeSettings').onclick=closePanels;$('nextBtn').onclick=()=>{closePanels();$('resultPanel').style.display='none';$('home').style.display='flex';$('startPanel').style.display='flex';$('logo').style.transform='translateX(-50%)';$('logo').style.opacity='1';renderHome()};
  $('gateUp').onclick=()=>buy('gate',$('gateUp'));$('moneyUp').onclick=()=>buy('moneyUp',$('moneyUp'));$('charUp').onclick=()=>buy('char',$('charUp'));
  $('musicVol').oninput=e=>{if(musicGain)musicGain.gain.value=Number(e.target.value)};$('sfxVol').oninput=e=>{if(sfxGain)sfxGain.gain.value=Number(e.target.value)};
}
function startAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();musicGain=audioCtx.createGain();sfxGain=audioCtx.createGain();musicGain.gain.value=Number($('musicVol').value);sfxGain.gain.value=Number($('sfxVol').value);musicGain.connect(audioCtx.destination);sfxGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();if(musicTimer)return;let step=0;musicTimer=setInterval(()=>{if(!running||state.paused)return;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='triangle';o.frequency.value=[196,247,294,247][step++%4];g.gain.value=.035;o.connect(g);g.connect(musicGain);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.stop(audioCtx.currentTime+.23)},260)}
function stopAudio(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function sfx(freq,dur){if(!audioCtx)return;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.09;o.connect(g);g.connect(sfxGain);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur+.02)}
renderHome();init();
</script>
