<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MogRun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd7ff;font-family:Inter,Arial,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#10233d}
.logo{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-weight:1000;font-size:36px;letter-spacing:4px;color:white;text-shadow:0 5px 0 #397db7,0 8px 18px #164d7c;transition:all .8s cubic-bezier(.2,.8,.2,1)}
.level{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-weight:800;color:white;text-shadow:0 2px 6px #397db7}
.looksWrap{position:absolute;top:102px;left:50%;transform:translateX(-50%);width:min(360px,72vw);height:12px;border:2px solid rgba(255,255,255,.9);border-radius:20px;background:rgba(25,75,120,.25);overflow:hidden}
.looks{height:100%;width:100%;background:linear-gradient(90deg,#7cf5ff,#69a7ff,#d58cff);border-radius:20px;transition:width .15s}
.money{position:absolute;top:20px;right:18px;background:rgba(255,255,255,.9);padding:10px 15px;border-radius:18px;font-weight:900;box-shadow:0 7px 22px #397db744}
.pause{position:absolute;top:20px;left:18px;width:46px;height:46px;border:0;border-radius:16px;background:rgba(255,255,255,.92);pointer-events:auto;font-size:20px;font-weight:900;box-shadow:0 7px 22px #397db744}
.startPanel{position:absolute;inset:auto 0 0 0;padding:0 18px 28px;display:flex;justify-content:center;pointer-events:auto}
.startBtn{border:0;padding:18px 54px;border-radius:24px;background:linear-gradient(135deg,#fff,#eaf6ff);font-size:21px;font-weight:1000;color:#174c78;box-shadow:0 12px 35px #205d8a55;cursor:pointer}
.home{position:absolute;bottom:22px;left:18px;right:18px;display:flex;gap:10px;justify-content:center;pointer-events:auto}
.hbtn{border:0;border-radius:18px;padding:13px 15px;background:rgba(255,255,255,.9);font-weight:900;color:#174c78;box-shadow:0 8px 24px #205d8a33}
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#081b2e66;backdrop-filter:blur(8px);pointer-events:auto}
.card{width:min(440px,92vw);background:linear-gradient(#fff,#edf7ff);border-radius:28px;padding:24px;box-shadow:0 30px 80px #06152577}
.card h2{margin:0 0 18px;font-size:27px}
.card button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:17px;background:#dff1ff;color:#174c78;font-size:16px;font-weight:900}
.card .primary{background:linear-gradient(135deg,#6adfff,#8f8cff);color:white}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.row label{font-weight:800}
input[type=range]{width:190px}
.upgrade{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0;padding:13px;border-radius:18px;background:#e8f5ff}
.upgrade small{display:block;color:#56718b;margin-top:3px}
.upgrade button{width:auto;margin:0;padding:10px 13px}
.boss{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;display:none;color:white;text-shadow:0 3px 10px #174c78}
.boss b{font-size:27px}
.hint{position:absolute;bottom:94px;left:50%;transform:translateX(-50%);color:white;font-weight:800;text-shadow:0 2px 8px #174c78;white-space:nowrap}
.gateLabel{position:absolute;display:none;transform:translate(-50%,-50%);font-size:24px;font-weight:1000;color:white;text-shadow:0 3px 8px #173d61;pointer-events:none}
</style>
</head>
<body>
<div id="ui">
  <div class="logo" id="logo">MOGRUN</div>
  <div class="level" id="level">LEVEL 1</div>
  <div class="looksWrap"><div class="looks" id="looks"></div></div>
  <div class="money" id="money">$0</div>
  <button class="pause" id="pauseBtn">Ⅱ</button>
  <div class="boss" id="boss"><b>BOSS</b><div id="bossNeed"></div></div>
  <div class="hint" id="hint">TAP TO RUN</div>
  <div class="startPanel" id="startPanel"><button class="startBtn" id="startBtn">START RUN</button></div>
  <div class="home" id="home">
    <button class="hbtn" id="upgradesBtn">UPGRADES</button>
    <button class="hbtn" id="settingsBtn">SETTINGS</button>
  </div>
</div>

<div class="panel" id="pausePanel"><div class="card">
<h2>PAUSED</h2><button class="primary" id="resumeBtn">CONTINUE</button><button id="pauseSettings">SETTINGS</button></div></div>

<div class="panel" id="settingsPanel"><div class="card">
<h2>SETTINGS</h2>
<div class="row"><label>MUSIC</label><input id="musicVol" type="range" min="0" max="1" step=".01" value=".55"></div>
<div class="row"><label>SFX</label><input id="sfxVol" type="range" min="0" max="1" step=".01" value=".75"></div>
<button id="settingsClose">BACK</button></div></div>

<div class="panel" id="upgradePanel"><div class="card">
<h2>UPGRADES</h2>
<div class="upgrade"><div><b>GATE CONTROL</b><small>Better gate outcomes</small></div><button id="gateUp">UPGRADE $100</button></div>
<div class="upgrade"><div><b>BOSS REWARD</b><small>Earn more money after bosses</small></div><button id="moneyUp">UPGRADE $100</button></div>
<div class="upgrade"><div><b>STARTING LOOKS</b><small>Begin each run with more Looks</small></div><button id="charUp">UPGRADE $100</button></div>
<button id="upgradeClose">BACK</button></div></div>

<div class="panel" id="resultPanel"><div class="card">
<h2 id="resultTitle">BOSS DEFEATED</h2><p id="resultText"></p>
<button class="primary" id="nextBtn">NEXT LEVEL</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const state={level:1,money:0,gate:0,moneyUp:0,char:0,started:false,paused:false,looks:100};
const $=id=>document.getElementById(id);
const save=()=>localStorage.mogrun=JSON.stringify(state);
try{Object.assign(state,JSON.parse(localStorage.mogrun||'{}'))}catch(e){}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmt(n){return Math.floor(n).toLocaleString('en-US')}

let scene,camera,renderer,player,playerGroup,bossGroup;
let running=false,runT=0,last=performance.now(),laneTarget=0,laneX=0;
let gates=[], obstacles=[], roadZ=0, audioCtx, musicGain, sfxGain, musicTimer;

function init(){
 scene=new THREE.Scene();
 scene.fog=new THREE.Fog(0x8fd7ff,30,145);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);
 camera.position.set(0,5.4,10.5); camera.lookAt(0,2,-22);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.body.prepend(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xdff7ff,0x7694a8,2.4));
 const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-12,18,8);sun.castShadow=true;scene.add(sun);

 const sky=new THREE.Mesh(new THREE.SphereGeometry(180,32,20),new THREE.MeshBasicMaterial({color:0x8fd7ff,side:THREE.BackSide}));
 scene.add(sky);

 const road=new THREE.Mesh(new THREE.BoxGeometry(14,.45,260),new THREE.MeshStandardMaterial({color:0xfafcff,roughness:.72}));
 road.position.set(0,-.25,-110);road.receiveShadow=true;scene.add(road);
 for(let x of [-4.7,4.7]){
   const edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.12,260),new THREE.MeshStandardMaterial({color:0xd7ecf7}));
   edge.position.set(x,0,-110);scene.add(edge);
 }
 for(let z=0;z>-240;z-=7){
   const line=new THREE.Mesh(new THREE.BoxGeometry(.08,.025,3.2),new THREE.MeshBasicMaterial({color:0xb8dce9}));
   line.position.set(0,.03,z);scene.add(line);
 }
 createPlayer();
 createBoss();
 buildLevel();
 bind();
 animate();
}
function mat(c,rough=.5){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.03})}
function sphere(r,c){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat(c));m.castShadow=true;return m}
function cyl(r,h,c){const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,h,8,16),mat(c));m.castShadow=true;return m}
function createHumanoid(stage=0){
 const g=new THREE.Group();
 const skin=[0xd9a47e,0xe4b38e,0xc99068,0xe8bd98,0xb97b50][stage%5];
 const shirt=[0x6e7883,0x2d4961,0xffffff,0x141a22,0x3b67a3][stage%5];
 const pants=[0x303944,0x202631,0x53657a,0x17191e,0x222f43][stage%5];
 const head=sphere(.72,skin);head.position.y=3.0;g.add(head);
 const neck=cyl(.22,.3,skin);neck.position.y=2.25;g.add(neck);
 const torso=cyl(.58,1.25,shirt);torso.position.y=1.55;g.add(torso);
 const hip=cyl(.62,.45,pants);hip.position.y=.75;g.add(hip);
 for(let s of [-1,1]){
   const arm=cyl(.18,1.0,skin);arm.position.set(s*.78,1.55,0);arm.rotation.z=s*.08;g.add(arm);
   const hand=sphere(.2,skin);hand.position.set(s*.78,.95,0);g.add(hand);
   const leg=cyl(.22,1.15,pants);leg.position.set(s*.28,-.05,0);g.add(leg);
   const shoe=cyl(.28,.55,0x20252b);shoe.position.set(s*.28,-.72,.08);g.add(shoe);
 }
 // hair
 const hair=sphere(.77,0x20242a);hair.scale.set(1,0.46,1);hair.position.set(0,3.52,0);g.add(hair);
 // eyes + brows
 for(let s of [-1,1]){
   const eye=sphere(.075,0x18212a);eye.position.set(s*.25,3.04,.68);g.add(eye);
   const brow=new THREE.Mesh(new THREE.BoxGeometry(.22,.045,.06),mat(0x20242a));brow.position.set(s*.25,3.23,.68);brow.rotation.z=s*.1;g.add(brow);
 }
 // stage details
 if(stage===0){
   for(let p of [[-.28,3.0],[.35,2.87],[-.05,2.78]]){let acne=sphere(.045,0xb34f4f);acne.position.set(p[0],p[1],.72);g.add(acne)}
 }
 if(stage>=1){const jaw=cyl(.08,.35,skin);jaw.rotation.z=Math.PI/2;jaw.scale.set(1,1,2.2);jaw.position.set(0,2.72,.66);g.add(jaw)}
 if(stage>=2){const chain=new THREE.Mesh(new THREE.TorusGeometry(.3,.035,8,24),mat(0xd8d8d8,.25));chain.position.set(0,1.72,.62);chain.rotation.x=Math.PI/2;g.add(chain)}
 if(stage>=3){const glasses=new THREE.Group();for(let s of [-1,1]){let l=new THREE.Mesh(new THREE.TorusGeometry(.17,.025,8,20),mat(0x15191f,.2));l.position.set(s*.24,3.06,.71);glasses.add(l)}g.add(glasses)}
 if(stage>=4){const coat=cyl(.72,1.35,0x12151a);coat.scale.set(1,.98,.65);coat.position.set(0,1.5,-.05);g.add(coat)}
 return g;
}
function createPlayer(){
 playerGroup=new THREE.Group(); player= createHumanoid(0); playerGroup.add(player);playerGroup.position.set(0,0,4);scene.add(playerGroup);
}
function createBoss(){
 bossGroup=createHumanoid(0);bossGroup.scale.set(1.18,1.18,1.18);bossGroup.position.set(0,0,-48);bossGroup.visible=false;scene.add(bossGroup);
}
function rebuildPlayer(){
 playerGroup.remove(player);player=createHumanoid(Math.min(4,Math.floor((state.level-1)/5)));playerGroup.add(player);
}
function buildLevel(){
 gates.forEach(o=>scene.remove(o)); obstacles.forEach(o=>scene.remove(o));gates=[];obstacles=[];
 for(let z=-15,i=0;z>-115;z-=13,i++){
   const type=i%4;
   const g=new THREE.Group();
   const left=makeGate(type==='0'?'+':'×', type===0?10+state.level*2: type===1?2: type===2?'-':'÷');
   const right=makeGate(type===2?'+':'×', type===2?12+state.level*2: type===3?2: type===0?'-':'÷');
   left.position.x=-2.35;right.position.x=2.35;g.add(left,right);g.position.z=z;scene.add(g);gates.push(g);
   if(i%2===1){let o=sphere(.7,0xd94b61);o.position.set((i%3-1)*2.4,1,z-6);o.scale.y=1.3;scene.add(o);obstacles.push(o)}
 }
}
function makeGate(op,val){
 const g=new THREE.Group();
 const poleMat=mat(0x8fc5e8), panelMat=mat(0x5d9bd3);
 for(let x of [-1.15,1.15]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,4,16),poleMat);p.position.set(x,2,0);p.castShadow=true;g.add(p)}
 let bar=new THREE.Mesh(new THREE.BoxGeometry(2.3,.12,.15),poleMat);bar.position.y=4;g.add(bar);
 let panel=new THREE.Mesh(new THREE.BoxGeometry(2.15,1.65,.12),panelMat);panel.position.y=2.65;g.add(panel);
 const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.clearRect(0,0,512,256);x.fillStyle='#fff';x.font='bold 145px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(op+val,256,128);
 const tex=new THREE.CanvasTexture(c);let label=new THREE.Mesh(new THREE.PlaneGeometry(1.9,.95),new THREE.MeshBasicMaterial({map:tex,transparent:true}));label.position.set(0,2.65,.09);g.add(label);
 g.userData={op,val};return g;
}
function applyGate(op,val){
 val=Number(val);
 if(op==='+') state.looks+=val;
 else if(op==='-') state.looks-=val;
 else if(op==='×') state.looks*=val;
 else if(op==='÷') state.looks/=val;
 state.looks=clamp(state.looks,0,999999);
}
function startRun(){
 state.started=true;running=true;runT=0;state.looks=100+state.char*10;laneX=0;laneTarget=0;
 $('startPanel').style.display='none';$('home').style.display='none';$('hint').textContent='';
 $('logo').style.transform='translateX(-50%) translateY(-90px)'; $('logo').style.opacity='.2';
 $('level').textContent='LEVEL '+state.level;rebuildPlayer();buildLevel();save();sfx(660,.07);
}
function endLevel(win){
 running=false;bossGroup.visible=false;
 const reward=Math.floor((40+state.level*12)*(1+state.moneyUp*.12));
 if(win){state.money+=reward;state.level++;$('resultTitle').textContent='BOSS DEFEATED';$('resultText').textContent='Reward: $'+fmt(reward);sfx(880,.14)}
 else{$('resultTitle').textContent='NOT ENOUGH LOOKS';$('resultText').textContent='The boss was stronger. Upgrade and try again.';sfx(180,.2)}
 $('resultPanel').style.display='flex';save();
}
function bossFight(){
 bossGroup.visible=true;bossGroup.position.set(0,0,-22);bossGroup.scale.set(1.2,1.2,1.2);
 const stage=Math.min(4,Math.floor((state.level-1)/25));
 bossGroup.clear();bossGroup.add(createHumanoid(stage));
 const need=Math.floor(110+state.level*18);
 $('bossNeed').textContent='Need '+fmt(need)+' Looks • You have '+fmt(state.looks);
 setTimeout(()=>endLevel(state.looks>=need),1200);
}
function animate(t=performance.now()){
 requestAnimationFrame(animate);const dt=Math.min(.035,(t-last)/1000);last=t;
 if(running&&!state.paused){
   runT+=dt; playerGroup.position.z-=dt*9;
   laneX+=(laneTarget-laneX)*Math.min(1,dt*10);playerGroup.position.x=laneX;
   player.rotation.z=Math.sin(runT*9)*.025;
   gates.forEach(g=>{if(!g.userData.hit&&g.position.z-playerGroup.position.z<.8&&g.position.z-playerGroup.position.z>-.8){
     const side=g.position.x??0;
   }});
   for(const gg of gates){
     if(gg.userData.hit)continue;
     if(Math.abs(gg.position.z-playerGroup.position.z)<.8){
       const chosen=laneX<0?gg.children[0]:gg.children[1]; applyGate(chosen.userData.op,chosen.userData.val);gg.userData.hit=true;sfx(520,.05);
     }
   }
   for(const o of obstacles){
     if(o.userData.hit)continue;
     if(Math.abs(o.position.z-playerGroup.position.z)<.75 && Math.abs(o.position.x-laneX)<1.15){o.userData.hit=true;state.looks*=.75;sfx(120,.12)}
   }
   $('looks').style.width=Math.min(100,state.looks/Math.max(100,state.level*18)*100)+'%';
   if(playerGroup.position.z<-108){bossFight()}
 }
 renderer.render(scene,camera);
}
function bind(){
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 let dragging=false;
 addEventListener('pointerdown',e=>{if(!running)return;dragging=true;move(e)});
 addEventListener('pointermove',e=>{if(dragging)move(e)});
 addEventListener('pointerup',()=>dragging=false);
 function move(e){laneTarget=clamp((e.clientX/innerWidth-.5)*9,-4.4,4.4)}
 $('startBtn').onclick=startRun;
 $('pauseBtn').onclick=()=>{if(running){state.paused=true;$('pausePanel').style.display='flex'}};
 $('resumeBtn').onclick=()=>{state.paused=false;$('pausePanel').style.display='none'};
 $('settingsBtn').onclick=()=>{$('settingsPanel').style.display='flex'};
 $('pauseSettings').onclick=()=>{$('pausePanel').style.display='none';$('settingsPanel').style.display='flex'};
 $('settingsClose').onclick=()=>{$('settingsPanel').style.display='none'};
 $('upgradesBtn').onclick=()=>{$('upgradePanel').style.display='flex'};
 $('upgradeClose').onclick=()=>{$('upgradePanel').style.display='none'};
 $('nextBtn').onclick=()=>{$('resultPanel').style.display='none';$('logo').style.transform='translateX(-50%)';$('logo').style.opacity='1';$('home').style.display='flex';$('hint').textContent='TAP TO RUN';$('level').textContent='LEVEL '+state.level;rebuildPlayer()};
 function buy(k,btn){
   const cost=100*(state[k]+1); if(state.money>=cost){state.money-=cost;state[k]++;save();sfx(720,.08)}
   btn.textContent='UPGRADE $'+(100*(state[k]+1));$('money').textContent='$'+fmt(state.money);
 }
 $('gateUp').onclick=()=>buy('gate',$('gateUp'));$('moneyUp').onclick=()=>buy('moneyUp');$('charUp').onclick=()=>buy('char',$('charUp'));
 $('musicVol').oninput=e=>musicGain&&(musicGain.gain.value=e.target.value);
 $('sfxVol').oninput=e=>sfxGain&&(sfxGain.gain.value=e.target.value);
 $('money').textContent='$'+fmt(state.money);
}
function initAudio(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 musicGain=audioCtx.createGain();sfxGain=audioCtx.createGain();musicGain.gain.value=.55;sfxGain.gain.value=.75;
 musicGain.connect(audioCtx.destination);sfxGain.connect(audioCtx.destination);
 let notes=[261.63,329.63,392,523.25,392,329.63];let i=0;
 musicTimer=setInterval(()=>{if(!running||state.paused)return;let o=audioCtx.createOscillator();o.type='triangle';o.frequency.value=notes[i++%notes.length];o.connect(musicGain);o.start();o.stop(audioCtx.currentTime+.18)},260);
}
function sfx(freq,dur){
 if(!audioCtx){try{initAudio();audioCtx.resume()}catch(e){return}}
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.001;o.connect(g);g.connect(sfxGain);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.02)
}
init();
</script>
</body>
</html>
